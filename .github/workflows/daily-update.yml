name: Gold website update

on:
  schedule:
    # GitHub cron uses UTC: 00:17/06:17/12:17/18:17 UTC
    # correspond to 08:17/14:17/20:17/02:17 Asia/Shanghai.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-website-update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install website dependencies
        run: npm ci --no-audit --no-fund

      - name: Install research dependencies
        run: |
          python -m venv .venv-research
          .venv-research/bin/python -m pip install --disable-pip-version-check -r research/requirements.txt

      - name: Restore deterministic production seeds
        run: |
          mkdir -p data/raw
          gzip -dc research/seeds/gold_eastmoney.csv.gz > data/raw/gold_eastmoney.csv
          gzip -dc research/seeds/dgs3mo_cash_yield.csv.gz > data/raw/dgs3mo_cash_yield.csv

      - name: Configure automation commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update data, verify website, and publish main
        env:
          TZ: Asia/Shanghai
        run: ./scripts/update_website_daily.sh
